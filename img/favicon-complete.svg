<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Waypoint (SPEC 13): variante "mapa completado" de favicon.svg; solo cambia el pin, en verde neón -->
  <!-- Fondo -->
  <rect x="0" y="0" width="16" height="16" fill="#0a0a0f"/>

  <!-- Mapa: relleno cian tenue (panel central más oscuro para marcar los pliegues) -->
  <rect x="2" y="10" width="3" height="4" fill="#00f5ff" fill-opacity="0.35"/>
  <rect x="6" y="9" width="4" height="4" fill="#00f5ff" fill-opacity="0.15"/>
  <rect x="11" y="10" width="3" height="4" fill="#00f5ff" fill-opacity="0.35"/>

  <!-- Mapa: contorno y pliegues cian -->
  <rect x="5" y="8" width="6" height="1" fill="#00f5ff"/>
  <rect x="1" y="9" width="5" height="1" fill="#00f5ff"/>
  <rect x="10" y="9" width="5" height="1" fill="#00f5ff"/>
  <rect x="1" y="10" width="1" height="4" fill="#00f5ff"/>
  <rect x="5" y="10" width="1" height="4" fill="#00f5ff"/>
  <rect x="10" y="10" width="1" height="4" fill="#00f5ff"/>
  <rect x="14" y="10" width="1" height="4" fill="#00f5ff"/>
  <rect x="6" y="13" width="4" height="1" fill="#00f5ff"/>
  <rect x="1" y="14" width="5" height="1" fill="#00f5ff"/>
  <rect x="10" y="14" width="5" height="1" fill="#00f5ff"/>

  <!-- Pin -->
  <g fill="#00ff88">
    <rect x="6" y="1" width="4" height="1"/>
    <rect x="5" y="2" width="6" height="1"/>
    <rect x="5" y="3" width="2" height="2"/>
    <rect x="9" y="3" width="2" height="2"/>
    <rect x="5" y="5" width="6" height="1"/>
    <rect x="6" y="6" width="4" height="1"/>
    <rect x="7" y="7" width="2" height="2"/>
  </g>
</svg>
